name: Daily auction sync

on:
  workflow_dispatch:

concurrency:
  group: daily-auction-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Extract on GitHub and ingest on VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Define snapshot date
        run: echo "RUN_DATE=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret VPS_HOST" && exit 1)
          test -n "$VPS_USER" || (echo "Missing secret VPS_USER" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "Missing secret VPS_SSH_KEY" && exit 1)

      - name: Extract CSVs on GitHub runner
        run: uv run python pipeline/extrai.py --date "$RUN_DATE" --verbose

      - name: Enrich property details on GitHub runner
        run: |
          # Baixa/parseia detalhes no runner (nao bloqueado pela Caixa).
          # Falhas parciais nao devem abortar o pipeline principal.
          uv run python pipeline/enriquece.py --date "$RUN_DATE" --limit 5000 --workers 8 --verbose \
            || echo "Enriquecimento parcial/inalado; seguindo sem dados enriquecidos."

      - name: Package snapshot
        run: |
          tar -czf "snapshot-${RUN_DATE}.tgz" \
            "data/caixa/dt=${RUN_DATE}" \
            $(test -d "data/enriquecidos/dt=${RUN_DATE}" && echo "data/enriquecidos/dt=${RUN_DATE}" || true)

      - name: Configure SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          for ATTEMPT in 1 2 3; do
            echo "Trust VPS host key: attempt $ATTEMPT/3 (host=$VPS_HOST port=$PORT)"
            if ssh-keyscan -T 10 -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Trust VPS host key failed after 3 attempts (host=$VPS_HOST port=$PORT)"
          exit 1

      - name: Upload snapshot to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          SSH_OPTS=(-o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectionAttempts=1)
          for ATTEMPT in 1 2 3; do
            echo "Upload snapshot to VPS: attempt $ATTEMPT/3 (host=$VPS_HOST port=$PORT)"
            if scp "${SSH_OPTS[@]}" -P "$PORT" "snapshot-${RUN_DATE}.tgz" "$VPS_USER@$VPS_HOST:/tmp/snapshot-${RUN_DATE}.tgz"; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Snapshot upload failed after 3 attempts (host=$VPS_HOST port=$PORT)"
          exit 1

      - name: Ingest snapshot on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          SSH_OPTS=(-o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectionAttempts=1)
          for ATTEMPT in 1 2 3; do
            echo "Ingest snapshot on VPS: attempt $ATTEMPT/3 (host=$VPS_HOST port=$PORT)"
            if ssh "${SSH_OPTS[@]}" -p "$PORT" "$VPS_USER@$VPS_HOST" "
              set -e
              CONTAINER=\$(docker ps --format '{{.Names}}' | grep '^projetos_leilao_insights-backend-' | head -n 1)
              test -n \"\$CONTAINER\" || (echo 'Backend container not found' && exit 1)
              docker cp /tmp/snapshot-${RUN_DATE}.tgz \"\$CONTAINER\":/tmp/snapshot-${RUN_DATE}.tgz
              docker exec \"\$CONTAINER\" sh -lc '
                mkdir -p /app/data &&
                tar -xzf /tmp/snapshot-${RUN_DATE}.tgz -C /app &&
                uv run python pipeline/run_daily_pipeline.py --date ${RUN_DATE} --verbose --skip-extract &&
                rm -f /tmp/snapshot-${RUN_DATE}.tgz
              '
              rm -f /tmp/snapshot-${RUN_DATE}.tgz
            "; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Snapshot ingestion failed after 3 attempts (host=$VPS_HOST port=$PORT)"
          exit 1
