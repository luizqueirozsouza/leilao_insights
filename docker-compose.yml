services:
  backend:
    build:
      context: .
    restart: always
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file:
      - .env
    command: ["uv", "run", "uvicorn", "backend_django.core.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - app-network

  fastapi:
    build:
      context: .
    restart: always
    ports:
      - "${FASTAPI_PORT:-8001}:8001"
    env_file:
      - .env
    command: ["uv", "run", "uvicorn", "backend_fastapi.main:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
