services:
  backend:
    build:
      context: .
    restart: always
    env_file:
      - .env
    command: ["sh", "-c", "cron && exec uv run uvicorn backend_django.core.asgi:application --host 0.0.0.0 --port 8000"]
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
