services:
  # Servidor API (Node.js)
  backend:
    build: 
      context: ./backend
    restart: always
    ports:
      - "${SERVER_PORT:-3001}:3001"
    env_file:
      - .env
    networks:
      - app-network

  # Interface Web (Vite + React)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:3001/api}
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

  # Dashboard de Dados (Streamlit)
  dashboard:
    build:
      context: .
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

