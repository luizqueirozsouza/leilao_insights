<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Leilao Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5h-5.2v-6.4H8.7V21H3.5a.5.5 0 0 1-.5-.5v-9.7Z" />
            </svg>
          </div>
          <div>
            <h1>Leilao <span>Insights</span></h1>
            <p>Painel de inteligencia imobiliaria</p>
            <div class="update-status">
              <span class="pulse-icon" aria-hidden="true"></span>
              <span>Atualizado em: <strong id="last-updated">-</strong></span>
            </div>
          </div>
        </div>

        <div class="stats-grid" id="stats">
          <article class="stat">
            <small>Imoveis</small>
            <strong id="stat-total">-</strong>
          </article>
          <article class="stat">
            <small>Cidades</small>
            <strong id="stat-cities">-</strong>
          </article>
          <article class="stat">
            <small>Media Avaliacao</small>
            <strong id="stat-average">-</strong>
          </article>
          <article class="stat">
            <small>Mediana</small>
            <strong id="stat-median">-</strong>
          </article>
        </div>
      </header>

      <section class="filters">
        <div class="filters-head">
          <button class="ghost-button" id="toggle-filters" type="button">
            <span class="icon-filter" aria-hidden="true"></span>
            Refinar busca
          </button>
          <div class="actions">
            <button class="sort-button" id="sort-button" type="button">Menor preco</button>
            <button class="clear-button" id="clear-button" type="button">Limpar</button>
            <button class="search-button" id="search-button" type="button">Buscar</button>
          </div>
        </div>

        <div class="filter-grid" id="filter-grid">
          <label class="field">
            <span>Estado</span>
            <select id="filter-uf">
              <option value="">Carregando...</option>
            </select>
          </label>

          <div class="field">
            <span>Cidade</span>
            <button class="multi-trigger" id="city-trigger" type="button" disabled>Todas</button>
            <div class="multi-panel" id="city-panel"></div>
          </div>

          <div class="field">
            <span>Bairro</span>
            <button class="multi-trigger" id="neighborhood-trigger" type="button" disabled>Todos</button>
            <div class="multi-panel" id="neighborhood-panel"></div>
          </div>

          <div class="field">
            <span>Modalidade</span>
            <button class="multi-trigger" id="modality-trigger" type="button">Todas</button>
            <div class="multi-panel" id="modality-panel"></div>
          </div>
        </div>
      </section>

      <main>
        <div class="status" id="status" hidden></div>
        <section class="cards-grid" id="properties"></section>
      </main>
    </div>

    <template id="property-template">
      <article class="property-card">
        <div class="photo-wrap">
          <img class="photo" alt="" loading="lazy" />
          <div class="badges">
            <span class="uf-badge"></span>
            <span class="discount-badge"></span>
          </div>
        </div>
        <div class="card-body">
          <div>
            <h2 class="city"></h2>
            <p class="modality"></p>
          </div>
          <div class="location">
            <strong class="neighborhood"></strong>
            <span class="address"></span>
          </div>
          <div class="price-box">
            <div class="valuation-row">
              <span>Avaliacao</span>
              <del class="valuation"></del>
            </div>
            <span class="price-label">Minimo para lance</span>
            <strong class="price"></strong>
          </div>
          <p class="description"></p>
        </div>
        <a class="doc-link" target="_blank" rel="noopener noreferrer">Ver documentacao</a>
      </article>
    </template>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
